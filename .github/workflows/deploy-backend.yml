name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend code
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.venv' --exclude='__pycache__' --exclude='.env' --exclude='logs' --exclude='*.pyc'
          path: backend/
          remote_path: /home/alltradebd/backend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install deps, run migrations, restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            source /home/alltradebd/virtualenv/backend/3.12/bin/activate
            cd /home/alltradebd/backend
            pip install -r requirements.txt
            alembic upgrade head
            pkill -f "uvicorn app.main:app" || true
            sleep 2
            ./start.sh
            mkdir -p tmp
            touch tmp/restart.txt