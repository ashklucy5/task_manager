name: Deploy Backend to cPanel
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend code
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.venv' --exclude='__pycache__' --exclude='.env' --exclude='logs' --exclude='*.pyc'
          path: backend/
          remote_path: /home/alltradebd/backend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install deps, run migrations, restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 90s
          script: |
            echo "MARKER-1: session started"
            source /home/alltradebd/virtualenv/backend/3.12/bin/activate
            echo "MARKER-2: venv activated"
            cd /home/alltradebd/backend
            echo "MARKER-3: cd done"
            pip install -r requirements.txt
            echo "MARKER-4: pip install done"
            timeout 10 pkill -f "uvicorn app.main:app"
            echo "MARKER-5: pkill exit code $?"
            sleep 2
            echo "MARKER-6: sleep done"
            chmod +x start.sh
            echo "MARKER-7: chmod done"
            timeout 20 nohup ./start.sh < /dev/null > /tmp/start_output.log 2>&1 &
            BGPID=$!
            echo "MARKER-8: backgrounded start.sh with PID $BGPID"
            sleep 8
            echo "MARKER-9: sleep after background done"
            cat /tmp/start_output.log
            echo "MARKER-10: cat done"
            mkdir -p tmp
            touch tmp/restart.txt
            echo "MARKER-11: restart touched, script complete"