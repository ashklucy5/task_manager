name: Deploy Backend to cPanel
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend code
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.venv' --exclude='__pycache__' --exclude='.env' --exclude='logs' --exclude='*.pyc'
          path: backend/
          remote_path: /home/alltradebd/backend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install deps, run migrations, restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 300s
          script: |
            echo "MARKER-1: session started"
            source /home/alltradebd/virtualenv/backend/3.12/bin/activate
            echo "MARKER-2: venv activated"
            cd /home/alltradebd/backend
            echo "MARKER-3: cd done"
            pip install -r requirements.txt --disable-pip-version-check --quiet
            echo "MARKER-4: pip install done"
            alembic upgrade head
            echo "MARKER-5: migrations done"
            mkdir -p tmp
            touch tmp/restart.txt
            echo "MARKER-6: restart touched, script complete"